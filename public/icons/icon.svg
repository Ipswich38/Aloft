<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0ea5e9"/>
  <!-- drone body -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms -->
    <line x1="256" y1="256" x2="150" y2="150"/>
    <line x1="256" y1="256" x2="362" y2="150"/>
    <line x1="256" y1="256" x2="150" y2="362"/>
    <line x1="256" y1="256" x2="362" y2="362"/>
    <!-- rotors -->
    <circle cx="150" cy="150" r="34"/>
    <circle cx="362" cy="150" r="34"/>
    <circle cx="150" cy="362" r="34"/>
    <circle cx="362" cy="362" r="34"/>
  </g>
  <!-- payload box -->
  <rect x="222" y="246" width="68" height="58" rx="8" fill="#f59e0b"/>
